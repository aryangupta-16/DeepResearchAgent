[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Backend for an agentic deep research platform."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0,<3",
    "greenlet>=3.0",
    "openai>=1.51",
    "httpx>=0.27",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "langgraph>=0.2",
    "pypdf>=6.16.2",
    "pgvector>=0.3",
    "python-multipart>=0.0.32",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "prometheus-client>=0.26.0",
    "aiobotocore>=2.15",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "live: requires real LLM API access; not run by default (set RUN_LIVE_LLM_TESTS=true)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
