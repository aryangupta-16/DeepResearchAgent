name: CI

# Phase A minimal gate: lint + tests on every push/PR. The compose smoke test
# boots the full stack (Postgres, Redis, API, worker) and hits /api/ready +
# /metrics, catching wiring/migration regressions that unit tests cannot.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check src tests migrations evals

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Eval golden-set gate (mocked tier)
        run: uv run pytest tests/unit/test_eval_harness.py -q

      - name: Run eval harness (score artifact)
        run: uv run python -m evals.runner --tier mocked

      - name: Upload eval artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-scores
          path: backend/eval-results/*.json
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck / build
        run: npx tsc --noEmit || npm run build

      - name: Unit tests (vitest)
        run: npm test

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Boot full stack
        working-directory: docker
        run: docker compose up -d --build api worker

      - name: Wait for API readiness
        working-directory: docker
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/ready || true)
            if [ "$code" = "200" ]; then echo "API ready"; exit 0; fi
            sleep 5
          done
          echo "API never became ready"; docker compose logs api worker; exit 1

      - name: Metrics endpoint serves Prometheus counters
        run: |
          curl -fsS http://localhost:8000/metrics | grep -q 'app_http_requests_total'

      - name: Worker metrics port serves Prometheus counters
        run: |
          curl -fsS http://localhost:9091/metrics | grep -q 'app_jobs_in_flight'

      - name: Teardown
        if: always()
        working-directory: docker
        run: docker compose down -v
